name: Signed update release integrity

on:
  pull_request:
    paths:
      - 'latest.json'
      - 'scripts/verify-release.mjs'
      - '.github/workflows/release-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'latest.json'
      - 'scripts/verify-release.mjs'
      - '.github/workflows/release-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify Ed25519 signature and GitHub Release asset digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.mjs
